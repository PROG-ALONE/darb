<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>القطع المكافئ</title>
<style>
:root{--bg:#f4f1ea;--ink:#27231d;--muted:#8a8172;--acc:#2f7d5b;--soft:#efe9dd;--line:#e4ded2;--card:#fff;--bad:#c0563f;--gold:#d8a53a}
*{box-sizing:border-box}
body{font-family:system-ui,sans-serif;background:var(--bg);color:var(--ink);margin:0;padding:10px}
.eq{text-align:center;font-size:15px;font-weight:700;color:var(--acc);margin:0 0 8px}
canvas{display:block;margin:0 auto;border-radius:12px;background:var(--card);border:1px solid var(--line)}
.ctrl{display:flex;justify-content:center;gap:10px;margin:8px 0;flex-wrap:wrap}
.param{display:flex;align-items:center;gap:4px;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:4px 8px}
.param label{font-size:13px;font-weight:700;color:var(--acc);min-width:16px;text-align:center}
.param input{width:56px;border:1px solid var(--line);border-radius:6px;padding:4px;font-size:13px;text-align:center;font-family:inherit}
.param button{min-width:32px;min-height:32px;border:0;border-radius:6px;background:var(--soft);cursor:pointer;font-size:14px;font-family:inherit;line-height:1}
.info{display:flex;justify-content:center;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--muted);margin-top:8px;padding:0 8px}
.info b{color:var(--ink)}
</style>
</head>
<body>
<div class="eq" id="eqLabel">y = ax² + bx + c</div>
<canvas id="cv" width="330" height="270"></canvas>
<div class="ctrl">
  <div class="param"><label>a</label><input id="ia" value="1"><button class="up">▲</button><button class="dn">▼</button></div>
  <div class="param"><label>b</label><input id="ib" value="0"><button class="up">▲</button><button class="dn">▼</button></div>
  <div class="param"><label>c</label><input id="ic" value="0"><button class="up">▲</button><button class="dn">▼</button></div>
</div>
<div class="info" id="infoBar"></div>
<script>
const INK='#27231d',MUTED='#8a8172',ACC='#2f7d5b',BAD='#c0563f',GOLD='#d8a53a',LINE='#e4ded2',CARD='#fff';
const P={a:1,b:0,c:0,sa:0.5,sb:1};
const cv=document.getElementById('cv'),c= cv.getContext('2d');
const W=cv.width,H=cv.height;
const px=function(v){return Math.round(v*100)/100;};
function adj(k,d){P[k]=px(P[k]+d);if(k==='a'&&P[k]===0)P[k]=0.5;sync();draw();}
function sync(){document.getElementById('ia').value=P.a;document.getElementById('ib').value=P.b;document.getElementById('ic').value=P.c;}
document.querySelectorAll('.param').forEach(function(p){
  var k=p.querySelector('label').textContent,inp=p.querySelector('input'),bs=p.querySelectorAll('button');
  bs[0].onclick=function(){adj(k,k==='a'?P.sa:P.sb);};
  bs[1].onclick=function(){adj(k,-(k==='a'?P.sa:P.sb));};
  inp.onchange=function(){var v=parseFloat(inp.value);if(!isNaN(v)){P[k]=px(v);if(k==='a'&&P[k]===0)P[k]=0.5;sync();draw();}};
});
function mapX(x){return 30+(x+8)*(W-60)/16;}
function mapY(y,ymin,ymax){return H-30-(y-ymin)*(H-60)/(ymax-ymin);}
function draw(){
  c.clearRect(0,0,W,H);
  var pts=[],ymin=1e9,ymax=-1e9,x;
  for(x=-8;x<=8;x+=0.08){var y=P.a*x*x+P.b*x+P.c;pts.push([x,y]);if(y<ymin)ymin=y;if(y>ymax)ymax=y;}
  var h=-P.b/(2*P.a),k=P.a*h*h+P.b*h+P.c;
  if(k<ymin)ymin=k-6;if(k>ymax)ymax=k+6;
  var pad=(ymax-ymin)*0.05;ymin-=pad;ymax+=pad;
  c.strokeStyle=INK;c.lineWidth=1.4;
  c.beginPath();c.moveTo(mapX(-8),mapY(0,ymin,ymax));c.lineTo(mapX(8),mapY(0,ymin,ymax));c.stroke();
  c.beginPath();c.moveTo(mapX(0),mapY(ymin,ymin,ymax));c.lineTo(mapX(0),mapY(ymax,ymin,ymax));c.stroke();
  c.fillStyle=INK;c.font='12px system-ui';c.textAlign='end';c.fillText('س',W-8,mapY(0,ymin,ymax)-6);
  c.textAlign='center';c.fillText('ص',30,28);
  c.strokeStyle=ACC;c.lineWidth=2.2;c.beginPath();
  pts.forEach(function(p,i){var sx=mapX(p[0]),sy=mapY(p[1],ymin,ymax);if(i===0)c.moveTo(sx,sy);else c.lineTo(sx,sy);});
  c.stroke();
  c.strokeStyle=BAD;c.lineWidth=1.4;c.setLineDash([5,4]);
  c.beginPath();c.moveTo(mapX(h),mapY(ymin,ymin,ymax));c.lineTo(mapX(h),mapY(ymax,ymin,ymax));c.stroke();c.setLineDash([]);
  c.fillStyle=BAD;c.beginPath();c.arc(mapX(h),mapY(k,ymin,ymax),4,0,Math.PI*2);c.fill();
  c.fillStyle=INK;c.font='12px system-ui';c.textAlign='center';c.fillText('الرأس ('+h.toFixed(2)+', '+k.toFixed(2)+')',mapX(h),mapY(k,ymin,ymax)-10);
  var dir=P.a>0?'يفتح للأعلى':'يفتح للأسفل';
  document.getElementById('eqLabel').textContent='y = '+P.a+'x² + '+P.b+'x + '+P.c;
  document.getElementById('infoBar').innerHTML='<b>الرأس (h,k):</b> ('+h.toFixed(2)+', '+k.toFixed(2)+') &nbsp; <b>المحور:</b> x = '+h.toFixed(2)+' &nbsp; <b>الاتجاه:</b> '+dir;
}
draw();
</script>
</body>
</html>
