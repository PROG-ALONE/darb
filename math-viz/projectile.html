<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
title>الرمي المائل</title>
<style>
:root{--bg:#f4f1ea;--ink:#27231d;--muted:#8a8172;--acc:#2f7d5b;--soft:#efe9dd;--line:#e4ded2;--card:#fff;--bad:#c0563f;--gold:#d8a53a}
*{box-sizing:border-box}
body{font-family:system-ui,sans-serif;background:var(--bg);color:var(--ink);margin:0;padding:10px}
.eq{text-align:center;font-size:15px;font-weight:700;color:var(--acc);margin:0 0 8px}
canvas{display:block;margin:0 auto;border-radius:12px;background:var(--card);border:1px solid var(--line)}
.ctrl{display:flex;justify-content:center;gap:10px;margin:8px 0;flex-wrap:wrap}
.param{display:flex;align-items:center;gap:4px;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:4px 8px}
.param label{font-size:13px;font-weight:700;color:var(--acc);min-width:16px;text-align:center}
.param input{width:56px;border:1px solid var(--line);border-radius:6px;padding:4px;font-size:13px;text-align:center;font-family:inherit}
.param button{min-width:32px;min-height:32px;border:0;border-radius:6px;background:var(--soft);cursor:pointer;font-size:14px;font-family:inherit;line-height:1}
.info{display:flex;justify-content:center;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--muted);margin-top:8px;padding:0 8px}
.info b{color:var(--ink)}
</style>
</head>
<body>
<div class="eq" id="eqLabel">المسار větρε ، الذرى والمدى</div>
<canvas id="cv" width="340" height="270"></canvas>
<div class="ctrl">
  <div class="param"><label>v₀</label><input id="iv0" value="20"><button class="up">▲</button><button class="dn">▼</button></div>
  <div class="param"><label>θ</label><input id="ith" value="45"><button class="up">▲</button><button class="dn">▼</button></div>
</div>
<div class="info" id="infoBar"></div>
<script>
const INK='#27231d',MUTED='#8a8172',ACC='#2f7d5b',BAD='#c0563f',GOLD='#d8a53a',LINE='#e4ded2',CARD='#fff';
const P={v0:20,th:45,g:9.8,sv:1,st:1};
const cv=document.getElementById('cv'),ct=cv.getContext('2d');
const W=cv.width,H=cv.height;
const px=function(v){return Math.round(v*100)/100;};
function adj(k,d){P[k]=px(P[k]+d);if(k==='v0'&&P[k]<1)P[k]=1;if(k==='v0'&&P[k]>50)P[k]=50;if(k==='th'&&P[k]<5)P[k]=5;if(k==='th'&&P[k]>85)P[k]=85;sync();draw();}
function sync(){document.getElementById('iv0').value=P.v0;document.getElementById('ith').value=P.th;}
document.querySelectorAll('.param').forEach(function(p){
  var k=p.querySelector('label').textContent,inp=p.querySelector('input'),bs=p.querySelectorAll('button');
  bs[0].onclick=function(){adj(k,k==='v0'?P.sv:P.st);};
  bs[1].onclick=function(){adj(k,-(k==='v0'?P.sv:P.st));};
  inp.onchange=function(){var v=parseFloat(inp.value);if(!isNaN(v)){P[k]=px(v);if(k==='v0'&&P[k]<1)P[k]=1;if(k==='v0'&&P[k]>50)P[k]=50;if(k==='th'&&P[k]<5)P[k]=5;if(k==='th'&&P[k]>85)P[k]=85;sync();draw();}};
});
function rad(d){return d*Math.PI/180;}
function draw(){
  ct.clearRect(0,0,W,H);
  var v0=P.v0,th=P.th,g=P.g,a=rad(th);
  var vx0=v0*Math.cos(a),vy0=v0*Math.sin(a);
  var T=2*vy0/g;
  var X=vx0*T;
  var H=vy0*vy0/(2*g);
  var xmax=X*1.18,ymax=H*1.35;
  if(xmax<10)xmax=10;if(ymax<4)ymax=4;
  var ox=55,oy=H-50;
  var sx=(W-100)/xmax,sy=(H-100)/ymax;
  function mx(x){return ox+x*sx;}
  function my(y){return oy-y*sy;}
  // axes
  ct.strokeStyle=INK;ct.lineWidth=1.4;
  ct.beginPath();ct.moveTo(mx(0),my(0));ct.lineTo(mx(xmax),my(0));ct.stroke();
  ct.beginPath();ct.moveTo(mx(0),my(0));ct.lineTo(mx(0),my(ymax));ct.stroke();
  ct.fillStyle=INK;ct.font='12px system-ui';ct.textAlign='end';ct.fillText('س',W-6,my(0)-6);
  ct.textAlign='center';ct.fillText('ص',32,26);
  ct.fillStyle=INK;ct.font='11px system-ui';ct.textAlign='center';ct.fillText('المدى Xmax',mx(X/2),my(0)+14);
  // trajectory
  ct.strokeStyle=ACC;ct.lineWidth=2.4;ct.beginPath();
  var first=true,t,dt=T/200;
  for(t=0;t<=T;t+=dt){var x=vx0*t,y=vy0*t-0.5*g*t*t;if(first){ct.moveTo(mx(x),my(y));first=false;}else ct.lineTo(mx(x),my(y));}
  ct.stroke();
  // apex
  var at=T/2,ax=vx0*at,ay=vy0*at-0.5*g*at*at;
  ct.fillStyle=BAD;ct.beginPath();ct.arc(mx(ax),my(ay),5,0,Math.PI*2);ct.fill();
  ct.fillStyle=INK;ct.font='12px system-ui';ct.textAlign='center';ct.fillText('الذروة',mx(ax),my(ay)-9);
  // initial velocity arrow and components
  var arl=Math.min(28,v0*1.5);
  ct.strokeStyle=GOLD;ct.lineWidth=2.2;
  ct.beginPath();ct.moveTo(mx(0),my(0));ct.lineTo(mx(arl*Math.cos(a)),my(arl*Math.sin(a)));ct.stroke();
  // arrow head
  ct.fillStyle=GOLD;ct.beginPath();
  var ex=arl*Math.cos(a),ey=arl*Math.sin(a),ang=a;
  ct.moveTo(mx(ex),my(ey));ct.lineTo(mx(ex)-Math.cos(ang-0.35)*7,my(ey)-Math.sin(ang-0.35)*7);ct.lineTo(mx(ex)-Math.cos(ang+0.35)*7,my(ey)-Math.sin(ang+0.35)*7);ct.fill();
  // vx horizontal component
  ct.strokeStyle=BAD;ct.lineWidth=1.6;ct.setLineDash([5,4]);
  ct.beginPath();ct.moveTo(mx(0),my(0));ct.lineTo(mx(arl*Math.cos(a)),my(0));ct.stroke();ct.setLineDash([]);
  // vy vertical component
  ct.beginPath();ct.moveTo(mx(arl*Math.cos(a)),my(0));ct.lineTo(mx(arl*Math.cos(a)),my(arl*Math.sin(a)));ct.stroke();ct.setLineDash([]);
  ct.fillStyle=INK;ct.font='12px system-ui';ct.textAlign='center';ct.fillText('vx',mx(arl*Math.cos(a)/2),my(0)-7);
  ct.textAlign='start';ct.fillText('vy',mx(arl*Math.cos(a))+4,my(arl*Math.sin(a)/2));
  document.getElementById('eqLabel').textContent='المسار větρε ، الذرى والمدى';
  document.getElementById('infoBar').innerHTML='<b>الارتفاع الأقصى H =</b> '+H.toFixed(2)+' م &nbsp; <b>المدى X =</b> '+X.toFixed(2)+' م &nbsp; <b>زمن الطيران T =</b> '+T.toFixed(2)+' ث';
}
draw();
</script>
</body>
</html>
