<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>العدسة المحدبة</title>
<style>
:root{--bg:#f4f1ea;--ink:#27231d;--muted:#8a8172;--acc:#2f7d5b;--soft:#efe9dd;--line:#e4ded2;--card:#fff;--bad:#c0563f;--gold:#d8a53a}
*{box-sizing:border-box}
body{font-family:system-ui,sans-serif;background:var(--bg);color:var(--ink);margin:0;padding:10px}
.eq{text-align:center;font-size:15px;font-weight:700;color:var(--acc);margin:0 0 8px}
canvas{display:block;margin:0 auto;border-radius:12px;background:var(--card);border:1px solid var(--line)}
.ctrl{display:flex;justify-content:center;gap:10px;margin:8px 0;flex-wrap:wrap}
.param{display:flex;align-items:center;gap:4px;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:4px 8px}
.param label{font-size:13px;font-weight:700;color:var(--acc);min-width:16px;text-align:center}
.param input{width:56px;border:1px solid var(--line);border-radius:6px;padding:4px;font-size:13px;text-align:center;font-family:inherit}
.param button{min-width:32px;min-height:32px;border:0;border-radius:6px;background:var(--soft);cursor:pointer;font-size:14px;font-family:inherit;line-height:1}
.info{display:flex;justify-content:center;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--muted);margin-top:8px;padding:0 8px}
.info b{color:var(--ink)}
</style>
</head>
<body>
<div class="eq" id="eqLabel">1/di = 1/f − 1/do &nbsp;·&nbsp; m = −di/do</div>
<canvas id="cv" width="340" height="260"></canvas>
<div class="ctrl">
  <div class="param"><label>f</label><input id="if" value="10"><button class="up">▲</button><button class="dn">▼</button></div>
  <div class="param"><label>do</label><input id="ido" value="15"><button class="up">▲</button><button class="dn">▼</button></div>
</div>
<div class="info" id="infoBar"></div>
<script>
const INK='#27231d',MUTED='#8a8172',ACC='#2f7d5b',BAD='#c0563f',GOLD='#d8a53a',LINE='#e4ded2',CARD='#fff';
const P={f:10,do:15,sf:1,sdo:1};
const cv=document.getElementById('cv'),ct=cv.getContext('2d');
const W=cv.width,H=cv.height;
const px=function(v){return Math.round(v*100)/100;};
function adj(k,d){P[k]=px(P[k]+d);if(P[k]<1)P[k]=1;if(k==='f'&&P[k]>20)P[k]=20;if(k==='do'&&P[k]>40)P[k]=40;sync();draw();}
function sync(){document.getElementById('if').value=P.f;document.getElementById('ido').value=P.do;}
document.querySelectorAll('.param').forEach(function(p){
  var k=p.querySelector('label').textContent,inp=p.querySelector('input'),bs=p.querySelectorAll('button');
  bs[0].onclick=function(){adj(k,P.sf);};
  bs[1].onclick=function(){adj(k,-P.sf);};
  inp.onchange=function(){var v=parseFloat(inp.value);if(!isNaN(v)){P[k]=px(v);if(P[k]<1)P[k]=1;if(k==='f'&&P[k]>20)P[k]=20;if(k==='do'&&P[k]>40)P[k]=40;sync();draw();}};
});
function mx(x){return W/2+x*((W-90)/44);}
function my(y){return H/2-y*((H-70)/22);}
function draw(){
  ct.clearRect(0,0,W,H);
  var f=P.f,do=P.do;
  var di = f*do/(do-f);
  var m = -di/do;
  var ho=2.2, hi=m*ho;
  var real = do>f;
  // axis
  ct.strokeStyle=INK;ct.lineWidth=1.4;
  ct.beginPath();ct.moveTo(mx(-24),my(0));ct.lineTo(mx(24),my(0));ct.stroke();
  ct.fillStyle=INK;ct.font='12px system-ui';ct.textAlign='end';ct.fillText('س',W-6,my(0)-6);
  // foci
  ct.fillStyle=BAD;ct.beginPath();ct.arc(mx(-f),my(0),4,0,Math.PI*2);ct.fill();
  ct.beginPath();ct.arc(mx(f),my(0),4,0,Math.PI*2);ct.fill();
  ct.fillStyle=INK;ct.font='11px system-ui';ct.textAlign='center';
  ct.fillText('-F',mx(-f),my(0)-8);ct.fillText('F',mx(f),my(0)-8);
  // lens
  ct.strokeStyle=ACC;ct.lineWidth=2.2;
  ct.beginPath();ct.moveTo(mx(0),my(-7));ct.lineTo(mx(0),my(7));ct.stroke();
  ct.beginPath();ct.moveTo(mx(-1.5),my(7));ct.lineTo(mx(1.5),my(7));ct.stroke();
  ct.beginPath();ct.moveTo(mx(-1.5),my(-7));ct.lineTo(mx(1.5),my(-7));ct.stroke();
  // object arrow
  ct.strokeStyle=BAD;ct.lineWidth=2.6;
  ct.beginPath();ct.moveTo(mx(-do),my(0));ct.lineTo(mx(-do),my(ho));ct.stroke();
  ct.fillStyle=BAD;ct.beginPath();ct.moveTo(mx(-do),my(ho));ct.lineTo(mx(-do)-4,my(ho)-3);ct.lineTo(mx(-do)+4,my(ho)-3);ct.fill();
  ct.fillStyle=INK;ct.font='12px system-ui';ct.textAlign='center';ct.fillText('الجسم',mx(-do),my(ho+1.2));
  // image arrow
  if(real){
    ct.strokeStyle=BAD;ct.lineWidth=2.6;
    ct.beginPath();ct.moveTo(mx(di),my(0));ct.lineTo(mx(di),my(hi));ct.stroke();
    ct.fillStyle=BAD;ct.beginPath();ct.moveTo(mx(di),my(hi));ct.lineTo(mx(di)-4,my(hi)+3);ct.lineTo(mx(di)+4,my(hi)+3);ct.fill();
    ct.fillStyle=INK;ct.textAlign='center';ct.fillText('الصورة الحقيقية',mx(di),my(hi-1));
  } else {
    ct.strokeStyle=ACC;ct.lineWidth=2.6;ct.setLineDash([5,4]);
    ct.beginPath();ct.moveTo(mx(di),my(0));ct.lineTo(mx(di),my(hi));ct.stroke();ct.setLineDash([]);
    ct.fillStyle=ACC;ct.beginPath();ct.moveTo(mx(di),my(hi));ct.lineTo(mx(di)-4,my(hi)-3);ct.lineTo(mx(di)+4,my(hi)-3);ct.fill();
    ct.fillStyle=INK;ct.textAlign='center';ct.fillText('الصورة الوهمية',mx(di),my(hi+1.4));
  }
  // center ray
  ct.strokeStyle=ACC;ct.lineWidth=1.6;
  if(real){
    ct.beginPath();ct.moveTo(mx(-do),my(ho));ct.lineTo(mx(0),my(0));ct.lineTo(mx(di),my(hi));ct.stroke();
    // parallel then through focus
    ct.beginPath();ct.moveTo(mx(-do),my(ho));ct.lineTo(mx(0),my(ho));ct.lineTo(mx(di),my(hi));ct.stroke();
  } else {
    ct.beginPath();ct.moveTo(mx(-do),my(ho));ct.lineTo(mx(0),my(0));ct.lineTo(mx(20),my(-20*ho/do));ct.stroke();
    ct.setLineDash([5,4]);ct.beginPath();ct.moveTo(mx(0),my(0));ct.lineTo(mx(di),my(hi));ct.stroke();ct.setLineDash([]);
    ct.beginPath();ct.moveTo(mx(-do),my(ho));ct.lineTo(mx(0),my(ho));ct.lineTo(mx(20),my(ho));ct.stroke();
    var slope=ho/f;var yatDi=slope*(di+f);
    ct.setLineDash([5,4]);ct.beginPath();ct.moveTo(mx(di),my(yatDi));ct.lineTo(mx(-f),my(0));ct.lineTo(mx(0),my(ho));ct.stroke();ct.setLineDash([]);
  }
  var type=do>f?'حقيقية (مقلوبة)':'وهمية (منتصبة)';
  document.getElementById('eqLabel').textContent='1/di = 1/f − 1/do &nbsp;·&nbsp; m = −di/do';
  document.getElementById('infoBar').innerHTML='<b>نوع الصورة:</b> '+type+' &nbsp; <b>di =</b> '+di.toFixed(2)+' سم &nbsp; <b>التكبير m =</b> '+m.toFixed(2);
}
draw();
</script>
</body>
</html>
