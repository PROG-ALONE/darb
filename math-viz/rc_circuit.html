<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
title>دائرة RC</title>
<style>
:root{--bg:#f4f1ea;--ink:#27231d;--muted:#8a8172;--acc:#2f7d5b;--soft:#efe9dd;--line:#e4ded2;--card:#fff;--bad:#c0563f;--gold:#d8a53a}
*{box-sizing:border-box}
body{font-family:system-ui,sans-serif;background:var(--bg);color:var(--ink);margin:0;padding:10px}
.eq{text-align:center;font-size:15px;font-weight:700;color:var(--acc);margin:0 0 8px}
canvas{display:block;margin:0 auto;border-radius:12px;background:var(--card);border:1px solid var(--line)}
.ctrl{display:flex;justify-content:center;gap:10px;margin:8px 0;flex-wrap:wrap}
.param{display:flex;align-items:center;gap:4px;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:4px 8px}
.param label{font-size:13px;font-weight:700;color:var(--acc);min-width:16px;text-align:center}
.param input{width:56px;border:1px solid var(--line);border-radius:6px;padding:4px;font-size:13px;text-align:center;font-family:inherit}
.param button{min-width:32px;min-height:32px;border:0;border-radius:6px;background:var(--soft);cursor:pointer;font-size:14px;font-family:inherit;line-height:1}
.info{display:flex;justify-content:center;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--muted);margin-top:8px;padding:0 8px}
.info b{color:var(--ink)}
</style>
</head>
<body>
<div class="eq" id="eqLabel">الشحن والتفريغ في دائرة RC</div>
<canvas id="cv" width="340" height="260"></canvas>
<div class="ctrl">
  <div class="param"><label>R</label><input id="iR" value="1000"><button class="up">▲</button><button class="dn">▼</button></div>
  <div class="param"><label>C</label><input id="iC" value="100"><button class="up">▲</button><button class="dn">▼</button></div>
  <div class="param"><label>V₀</label><input id="iV" value="10"><button class="up">▲</button><button class="dn">▼</button></div>
</div>
<div class="info" id="infoBar"></div>
<script>
const INK='#27231d',MUTED='#8a8172',ACC='#2f7d5b',BAD='#c0563f',GOLD='#d8a53a',LINE='#e4ded2',CARD='#fff';
const P={R:1000,C:100,V0:10,sR:100,sC:10,sV:1};
const cv=document.getElementById('cv'),ct=cv.getContext('2d');
const W=cv.width,H=cv.height;
const px=function(v){return Math.round(v*100)/100;};
function adj(k,d){P[k]=px(P[k]+d);if(P[k]<1)P[k]=1;sync();draw();}
function sync(){document.getElementById('iR').value=P.R;document.getElementById('iC').value=P.C;document.getElementById('iV').value=P.V0;}
document.querySelectorAll('.param').forEach(function(p){
  var k=p.querySelector('label').textContent,inp=p.querySelector('input'),bs=p.querySelectorAll('button');
  bs[0].onclick=function(){adj(k,k==='R'?P.sR:k==='C'?P.sC:P.sV);};
  bs[1].onclick=function(){adj(k,-(k==='R'?P.sR:k==='C'?P.sC:P.sV));};
  inp.onchange=function(){var v=parseFloat(inp.value);if(!isNaN(v)){P[k]=px(v);if(P[k]<1)P[k]=1;sync();draw();}};
});
function mx(t){return 40+(t/6)*(W-80);}
function my(v){return H-40-(v/P.V0)*(H-80);}
function draw(){
  ct.clearRect(0,0,W,H);
  var tau=P.R*P.C/1e6; // seconds, since C in uF
  // axes
  ct.strokeStyle=INK;ct.lineWidth=1.4;
  ct.beginPath();ct.moveTo(mx(0),my(0));ct.lineTo(mx(6),my(0));ct.stroke();
  ct.beginPath();ct.moveTo(mx(0),my(0));ct.lineTo(mx(0),my(1));ct.stroke();
  ct.fillStyle=INK;ct.font='12px system-ui';ct.textAlign='end';ct.fillText('t/τ',W-6,my(0)-6);
  ct.textAlign='center';ct.fillText('V',28,32);
  // ticks 1..5 tau
  ct.fillStyle=INK;ct.font='11px system-ui';ct.textAlign='center';
  for(var i=1;i<=5;i++){ct.fillText(i+'τ',mx(i),my(0)+14);}
  // charging curve Vc = V0(1-e^-t/tau)
  ct.strokeStyle=ACC;ct.lineWidth=2.2;ct.beginPath();
  var first=true,t;
  for(t=0;t<=5.2;t+=0.02){var v=P.V0*(1-Math.exp(-t/tau));var sx=mx(t),sy=my(v);if(first){ct.moveTo(sx,sy);first=false;}else ct.lineTo(sx,sy);}
  ct.stroke();
  // discharging curve V = V0 e^-t/tau
  ct.strokeStyle=BAD;ct.lineWidth=2.2;ct.beginPath();
  first=true;
  for(t=0;t<=5.2;t+=0.02){var v=P.V0*Math.exp(-t/tau);var sx=mx(t),sy=my(v);if(first){ct.moveTo(sx,sy);first=false;}else ct.lineTo(sx,sy);}
  ct.stroke();
  // mark t=tau points
  var v1=P.V0*(1-Math.exp(-1));
  ct.fillStyle=ACC;ct.beginPath();ct.arc(mx(1),my(v1),4,0,Math.PI*2);ct.fill();
  ct.fillStyle=BAD;ct.beginPath();ct.arc(mx(1),my(P.V0/Math.E),4,0,Math.PI*2);ct.fill();
  document.getElementById('eqLabel').textContent='الشحن والتفريغ في دائرة RC';
  document.getElementById('infoBar').innerHTML='<b>τ = RC =</b> '+tau.toFixed(2)+' ث &nbsp; <b>V(τ) =</b> '+v1.toFixed(2)+' فولت (63.2%) &nbsp; <b>V(5τ) ≈</b> '+(P.V0*(1-Math.exp(-5))).toFixed(2)+' (99.3%)';
}
draw();
</script>
</body>
</html>
