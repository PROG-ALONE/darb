<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 200" role="img" aria-label="المبني للمجهول 전환 من الفاعل إلى المفعول">
  <!-- الجملة الفاعلية -->
  <rect x="20" y="30" width="115" height="48" rx="8" fill="#2f7d5b"/>
  <text x="77" y="56" text-anchor="middle" fill="#fff" font-size="11" font-weight="700" font-family="system-ui, Arial, sans-serif">المبني للفاعل</text>
  <text x="77" y="72" text-anchor="middle" fill="#fff" font-size="10" font-family="system-ui, Arial, sans-serif">The chef cooks the meal</text>
  <!-- السهم -->
  <line x1="140" y1="78" x2="140" y2="112" stroke="#d8a53a" stroke-width="2" marker-end="url(#figArrow_eng)"/>
  <text x="155" y="94" text-anchor="start" font-size="11" fill="#d8a53a" font-weight="700" font-family="system-ui, Arial, sans-serif">be + V3</text>
  <!-- الجملة المبنية للمجهول -->
  <rect x="165" y="30" width="115" height="48" rx="8" fill="#faf0d4" stroke="#8a6d1f" stroke-width="2"/>
  <text x="222" y="56" text-anchor="middle" fill="#8a6d1f" font-size="11" font-weight="700" font-family="system-ui, Arial, sans-serif">المبني للمجهول</text>
  <text x="222" y="72" text-anchor="middle" fill="#8a6d1f" font-size="10" font-family="system-ui, Arial, sans-serif">The meal is cooked by the chef</text>
  <text x="150" y="134" text-anchor="middle" font-size="11" fill="#555" font-family="system-ui, Arial, sans-serif">المفعول يصعد إلى موضع الفاعل</text>
  <text x="150" y="154" text-anchor="middle" font-size="10" fill="#555" font-family="system-ui, Arial, sans-serif">Passive voice: be + الجزء الثالث + by</text>
</svg>
