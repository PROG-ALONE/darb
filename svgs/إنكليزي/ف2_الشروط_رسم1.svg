<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 200" role="img" aria-label="الجمل الشرطية أنواعها 1 2 3">
  <rect x="30" y="30" width="240" height="36" rx="6" fill="#efe9dd" stroke="#8a8172" stroke-width="2"/>
  <text x="150" y="54" text-anchor="middle" font-size="11" fill="#555">Type 1: If + present → will + V</text>
  <rect x="30" y="75" width="240" height="36" rx="6" fill="#d7ebe0" stroke="#1a5c3a" stroke-width="2"/>
  <text x="150" y="99" text-anchor="middle" font-size="11" fill="#1a5c3a">Type 2: If + past → would + V</text>
  <rect x="30" y="120" width="240" height="36" rx="6" fill="#faf0d4" stroke="#8a6d1f" stroke-width="2"/>
  <text x="150" y="144" text-anchor="middle" font-size="11" fill="#8a6d1f">Type 3: If + had + pp → would have + pp</text>
  <text x="150" y="186" text-anchor="middle" font-size="10" fill="#555">Zero / First / Second / Third conditional ladder</text>
</svg>
