<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 200" role="img" aria-label="أحكام الميم الساكنة الإدغام والإخفاء والإقلاب">
  <rect x="130" y="40" width="40" height="36" rx="8" fill="#2f7d5b"/>
  <text x="150" y="62" text-anchor="middle" fill="#fff" font-size="11" font-weight="700" font-family="system-ui">الميم الساكنة</text>
  <line x1="130" y1="76" x2="70" y2="50" stroke="#555" stroke-width="1.5" marker-end="url(#figArrow_arabic)"/>
  <rect x="20" y="30" width="56" height="28" rx="6" fill="#d7ebe0"/><text x="48" y="49" text-anchor="middle" font-size="10" fill="#1a5c3a">الإدغام</text>
  <line x1="170" y1="76" x2="220" y2="50" stroke="#555" stroke-width="1.5" marker-end="url(#figArrow_arabic)"/>
  <rect x="180" y="30" width="56" height="28" rx="6" fill="#efe9dd"/><text x="208" y="49" text-anchor="middle" font-size="10" fill="#27231d">الإخفاء</text>
  <line x1="145" y1="136" x2="70" y2="162" stroke="#555" stroke-width="1.5" marker-end="url(#figArrow_arabic)"/>
  <rect x="20" y="152" width="56" height="28" rx="6" fill="#f6ddd6"/><text x="48" y="171" text-anchor="middle" font-size="10" fill="#8a3020">الإقلاب</text>
  <text x="150" y="190" text-anchor="middle" font-size="10" fill="#555">الإدغام (ميم + ميم) → الإخفاء (ميم + باء) → الإقلاب (ميم + باء)</text>
</svg>
