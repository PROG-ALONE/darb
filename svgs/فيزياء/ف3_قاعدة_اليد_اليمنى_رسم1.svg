<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 200" role="img" aria-label="قاعدة اليد اليمنى للموصل المستقيم والمجال المغناطيسي">
  <!-- الموصل المستقيم -->
  <line x1="150" y1="40" x2="150" y2="160" stroke="#555" stroke-width="8" stroke-linecap="round"/>
  <text x="150" y="30" text-anchor="middle" font-size="13" fill="#555" font-weight="700" font-family="system-ui, Arial, sans-serif">تيّار إلى الأعلى</text>
  <text x="150" y="174" text-anchor="middle" fill="#555" font-size="11" font-family="system-ui, Arial, sans-serif">I</text>
  <!-- خطوط المجال الدائرية حول الموصل -->
  <circle cx="150" cy="100" r="30" fill="none" stroke="#8a8172" stroke-width="1.6" stroke-dasharray="5,4"/>
  <circle cx="150" cy="100" r="50" fill="none" stroke="#8a8172" stroke-width="1.2" stroke-dasharray="4,5" opacity="0.7"/>
  <path d="M 170 100 A 20 20 0 1 1 130 100" fill="none" stroke="#555" stroke-width="1.4" marker-end="url(#figArrow_phy)"/>
  <path d="M 190 100 A 40 40 0 1 1 110 100" fill="none" stroke="#555" stroke-width="1.2" marker-end="url(#figArrow_phy)"/>
  <text x="190" y="106" text-anchor="start" font-size="10" fill="#555" font-family="system-ui, Arial, sans-serif">اتجاه المجال</text>
  <text x="150" y="186" text-anchor="middle" font-size="10" fill="#555" font-family="system-ui, Arial, sans-serif">قاعدة اليد اليمنى: الإبهام إلى التيّار، الأصابع إلى المجال</text>
</svg>
