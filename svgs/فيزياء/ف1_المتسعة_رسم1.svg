<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 200" role="img" aria-label="المتسعة اللوحان المتوازيان والمجال والشحنة والمسافة">
  <!-- اللوح الموجب -->
  <rect x="75" y="40" width="14" height="120" rx="3" fill="#c0563f"/>
  <text x="72" y="34" text-anchor="end" font-size="16" fill="#c0563f" font-weight="700" font-family="system-ui, Arial, sans-serif">+</text>
  <!-- اللوح السالب -->
  <rect x="211" y="40" width="14" height="120" rx="3" fill="#2f7d5b"/>
  <text x="225" y="34" text-anchor="start" font-size="16" fill="#2f7d5b" font-weight="700" font-family="system-ui, Arial, sans-serif">−</text>
  <!-- خطوط المجال -->
  <line x1="89" y1="65" x2="211" y2="65" stroke="#8a8172" stroke-width="1.6" marker-end="url(#figArrow_phy)"/>
  <line x1="89" y1="100" x2="211" y2="100" stroke="#8a8172" stroke-width="2" marker-end="url(#figArrow_phy)"/>
  <line x1="89" y1="135" x2="211" y2="135" stroke="#8a8172" stroke-width="1.6" marker-end="url(#figArrow_phy)"/>
  <text x="150" y="88" text-anchor="middle" font-size="12" fill="#555" font-family="system-ui, Arial, sans-serif">E</text>
  <!-- المسافة d -->
  <line x1="89" y1="172" x2="211" y2="172" stroke="#555" stroke-width="1.2" marker-start="url(#figArrow_phy)" marker-end="url(#figArrow_phy)"/>
  <text x="150" y="188" text-anchor="middle" font-size="11" fill="#555" font-family="system-ui, Arial, sans-serif">d</text>
  <text x="150" y="198" text-anchor="middle" font-size="10" fill="#555" font-family="system-ui, Arial, sans-serif">C = ε₀εr·A/d</text>
</svg>
