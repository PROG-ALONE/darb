<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 200" role="img" aria-label="دائرة RC مقاومة متسعة ومصدر">
  <!-- المصدر -->
  <circle cx="50" cy="100" r="14" fill="#c0563f" stroke="#7a2d23" stroke-width="2"/>
