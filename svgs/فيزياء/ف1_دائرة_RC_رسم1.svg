  <text x="130" y="104" text-anchor="middle" font-size="11" fill="#8a6d1f" font-weight="700" font-family="system-ui, Arial, sans-serif">R</text>
  <!-- المتسعة -->
  <rect x="170" y="80" width="10" height="40" rx="2" fill="#d7ebe0" stroke="#1a5c3a" stroke-width="2"/>
  <rect x="184" y="80" width="10" height="40" rx="2" fill="#d7ebe0" stroke="#1a5c3a" stroke-width="2"/>
  <text x="179" y="130" text-anchor="middle" font-size="11" fill="#1a5c3a" font-weight="700" font-family="system-ui, Arial, sans-serif">C</text>
  <!-- الأسلاك -->
  <line x1="64" y1="100" x2="110" y2="100" stroke="#555" stroke-width="2" marker-end="url(#figArrow_phy)"/>
  <line x1="150" y1="100" x2="170" y2="100" stroke="#555" stroke-width="2"/>
  <line x1="194" y1="100" x2="230" y2="100" stroke="#555" stroke-width="2"/>
  <line x1="230" y1="100" x2="230" y2="70" stroke="#555" stroke-width="2"/>
  <line x1="230" y1="70" x2="36" y2="70" stroke="#555" stroke-width="2"/>
  <line x1="36" y1="70" x2="36" y2="86" stroke="#555" stroke-width="2"/>
  <line x1="36" y1="86" x2="50" y2="86" stroke="#555" stroke-width="2"/>
  <text x="150" y="180" text-anchor="middle" font-size="10" fill="#555" font-family="system-ui, Arial, sans-serif">τ = RC</text>
