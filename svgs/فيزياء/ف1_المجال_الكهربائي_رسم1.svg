<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 200" role="img" aria-label="خطوط المجال الكهربائي حول شحنة موجبة وشحنة سالبة">
  <!-- الشحنة الموجبة -->
  <circle cx="75" cy="100" r="16" fill="#c0563f" stroke="#7a2d23" stroke-width="2"/>
  <text x="75" y="105" text-anchor="middle" fill="#fff" font-size="15" font-weight="700" font-family="system-ui, Arial, sans-serif">+</text>
  <text x="75" y="132" text-anchor="middle" font-size="11" fill="#555" font-family="system-ui, Arial, sans-serif">شحنة موجبة</text>
  <!-- الشحنة السالبة -->
  <circle cx="225" cy="100" r="16" fill="#2f7d5b" stroke="#1d4c38" stroke-width="2"/>
  <text x="225" y="105" text-anchor="middle" fill="#fff" font-size="15" font-weight="700" font-family="system-ui, Arial, sans-serif">−</text>
  <text x="225" y="132" text-anchor="middle" font-size="11" fill="#555" font-family="system-ui, Arial, sans-serif">شحنة سالبة</text>
  <!-- خطوط المجال من الموجبة إلى السالبة -->
  <line x1="91" y1="70" x2="209" y2="70" stroke="#555" stroke-width="1.6" marker-end="url(#figArrow_phy)"/>
  <line x1="91" y1="100" x2="209" y2="100" stroke="#555" stroke-width="2" marker-end="url(#figArrow_phy)"/>
  <line x1="91" y1="130" x2="209" y2="130" stroke="#555" stroke-width="1.6" marker-end="url(#figArrow_phy)"/>
  <!-- خطوطausstellung خارجية من الموجبة -->
  <path d="M 91 70 Q 110 40 140 40" fill="none" stroke="#555" stroke-width="1.2" opacity="0.6" marker-end="url(#figArrow_phy)"/>
  <path d="M 91 130 Q 110 160 140 160" fill="none" stroke="#555" stroke-width="1.2" opacity="0.6" marker-end="url(#figArrow_phy)"/>
  <!-- خطوط دخول للسالبة -->
  <path d="M 160 40 Q 190 40 209 70" fill="none" stroke="#555" stroke-width="1.2" opacity="0.6" marker-end="url(#figArrow_phy)"/>
  <path d="M 160 160 Q 190 160 209 130" fill="none" stroke="#555" stroke-width="1.2" opacity="0.6" marker-end="url(#figArrow_phy)"/>
  <text x="150" y="40" text-anchor="middle" font-size="10" fill="#555" font-family="system-ui, Arial, sans-serif">اتجاه المجال: من + إلى −</text>
  <text x="150" y="190" text-anchor="middle" font-size="10" fill="#555" font-family="system-ui, Arial, sans-serif">كثافة الخطوط = شدة المجال</text>
</svg>
