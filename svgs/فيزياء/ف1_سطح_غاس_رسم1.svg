<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 200" role="img" aria-label="سطح غاس كروي حول شحنة مركزية">
  <!-- الشحنة المركزية -->
  <circle cx="150" cy="100" r="10" fill="#c0563f" stroke="#7a2d23" stroke-width="2"/>
  <text x="150" y="105" text-anchor="middle" fill="#fff" font-size="14" font-weight="700" font-family="system-ui, Arial, sans-serif">+q</text>
  <!-- سطح غاس الكروي -->
  <circle cx="150" cy="100" r="55" fill="none" stroke="#2f7d5b" stroke-width="2" stroke-dasharray="6,5"/>
  <text x="150" y="42" text-anchor="middle" font-size="11" fill="#2f7d5b" font-family="system-ui, Arial, sans-serif">سطح غاس الكروي</text>
  <!-- خطوط المجال الشعاعية -->
  <line x1="150" y1="100" x2="150" y2="40" stroke="#555" stroke-width="1.4" marker-end="url(#figArrow_phy)"/>
  <line x1="150" y1="100" x2="205" y2="65" stroke="#555" stroke-width="1.4" marker-end="url(#figArrow_phy)"/>
  <line x1="150" y1="100" x2="205" y2="135" stroke="#555" stroke-width="1.4" marker-end="url(#figArrow_phy)"/>
  <line x1="150" y1="100" x2="150" y2="160" stroke="#555" stroke-width="1.4" marker-end="url(#figArrow_phy)"/>
  <line x1="150" y1="100" x2="95" y2="135" stroke="#555" stroke-width="1.4" marker-end="url(#figArrow_phy)"/>
  <line x1="150" y1="100" x2="95" y2="65" stroke="#555" stroke-width="1.4" marker-end="url(#figArrow_phy)"/>
  <!-- نصف قطر السطح -->
  <line x1="150" y1="100" x2="205" y2="100" stroke="#d8a53a" stroke-width="1.6" stroke-dasharray="4,3"/>
  <text x="180" y="94" text-anchor="middle" font-size="11" fill="#d8a53a" font-family="system-ui, Arial, sans-serif">r</text>
  <text x="150" y="180" text-anchor="middle" font-size="10" fill="#555" font-family="system-ui, Arial, sans-serif">الفيض الكهربائي = q/ε₀ عبر سطح غاس مغلق</text>
</svg>
