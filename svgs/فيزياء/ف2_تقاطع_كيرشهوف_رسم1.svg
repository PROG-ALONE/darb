<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 200" role="img" aria-label="تقاطع كيرشهوف جمع التيارات وارد يساوي صادر">
  <!-- العقدة -->
  <circle cx="150" cy="100" r="12" fill="#2f7d5b" stroke="#1d4c38" stroke-width="2"/>
  <text x="150" y="104" text-anchor="middle" fill="#fff" font-size="12" font-weight="700" font-family="system-ui, Arial, sans-serif">A</text>
  <!-- تيار وارد -->
  <line x1="100" y1="70" x2="138" y2="88" stroke="#2f7d5b" stroke-width="3" marker-end="url(#figArrow_phy)"/>
  <text x="92" y="64" text-anchor="end" font-size="11" fill="#2f7d5b" font-family="system-ui, Arial, sans-serif">I₁ وارد</text>
  <!-- تيار وارد آخر -->
  <line x1="100" y1="130" x2="138" y2="112" stroke="#2f7d5b" stroke-width="3" marker-end="url(#figArrow_phy)"/>
  <text x="92" y="136" text-anchor="end" font-size="11" fill="#2f7d5b" font-family="system-ui, Arial, sans-serif">I₂ وارد</text>
  <!-- تيار صادر -->
  <line x1="162" y1="88" x2="200" y2="70" stroke="#c0563f" stroke-width="3" marker-end="url(#figArrow_phy)"/>
  <text x="208" y="64" text-anchor="start" font-size="11" fill="#c0563f" font-family="system-ui, Arial, sans-serif">I₃ صادر</text>
  <text x="150" y="150" text-anchor="middle" font-size="11" fill="#555" font-family="system-ui, Arial, sans-serif">ΣI وارد = ΣI صادر</text>
  <text x="150" y="170" text-anchor="middle" font-size="10" fill="#555" font-family="system-ui, Arial, sans-serif">قانون كيرشهوف للتيارات</text>
</svg>
